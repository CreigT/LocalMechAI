name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q localmechai local-agent shared

      - name: Run tests when present
        shell: pwsh
        run: |
          if (Test-Path tests) {
            python -m unittest discover -s tests -v
          } else {
            Write-Host "No tests directory yet; compile verification completed."
          }
